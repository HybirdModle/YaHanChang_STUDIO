baseURL = "https://github.io"
languageCode = "zh-tw"
title = "YaHanChang Art Studio"
theme = "congo"

[params]
  # 💡 終極修正點 1：Congo 主題的 homepageLayout 必須設定為 "cards" (複數型)，才會啟動首頁卡片牆
  homepageLayout = "cards"
  
  # 💡 終極修正點 2：大聲告訴 Hugo，主首頁要自動抓取 "projects" 資料夾裡的所有作品卡片！
  mainSections = ["projects"]

[menu]
  # 右上角的導覽列標籤
  [[menu.main]]
    name = "所有作品"
    pageRef = "projects"
    weight = 1
